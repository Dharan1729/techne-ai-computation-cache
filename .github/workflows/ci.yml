name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  core-install:
    # The light install must work without torch, fastapi or langchain.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install .
      - name: CLI works on the core install with the dependency-free embedder
        run: |
          aicache init /tmp/c.yaml
          aicache validate /tmp/c.yaml
          aicache test /tmp/c.yaml --embedder hashing || true
          python -c "import aicache; print(aicache.__version__)"

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ["3.10", "3.11", "3.12"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python-version }}"}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-langcache-embed-v1
      - name: CPU-only torch (the default wheel pulls GPU libraries)
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Example config and labeled set stay clean
        run: |
          aicache validate examples/finance_tools.yaml --strict
          aicache test examples/finance_tools.yaml
          aicache eval examples/finance_tools.yaml --labeled examples/finance_labeled.jsonl
